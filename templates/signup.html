<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign</title>
     <!-- Font Awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h1>StaySwich<span class="dot">.</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="{{url_for('index')}}" >Home</a></li>
            <li><a href="{{url_for('about')}}">About</a></li>
            <!-- <a href="{{url_for('auth.profile')}}" class="profile-btn active"><i class="fa-solid fa-user"></i></a> -->
        </ul>
        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i> <!-- FontAwesome icon -->
        </button>
    </nav>
    <div class="container">
        <div class="mask"> 
            <div class="login-box">
              
                <h2>Sign Up</h2>
   
               
                <form id="signup-form" action="{{url_for('auth.signup')}}" method="POST">
                    <label for="fullname">Full Name</label>
                    <input type="text" name="fullname" id="fullname" placeholder="Full Name" required />
                    <span id="fullname-error" class="error-message">Please enter a valid full name.</span>
          
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Example@gmail.com" required />
                    <span id="email-error" class="error-message">Please enter a valid email address.</span>

                    <label for="Password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" required />
                    <span id="password-error" class="error-message">Password must be at least 6 characters.</span> 
                    <input type="submit" value="Sign Up" class="submit" disabled />
                  </form>
                <div class="haveAccout">
                    <a href="{{url_for('auth.login')}}">already have an account?</a>

                </div>
            </div>
        </div>
    </div>
    <script src="../static/js/signup.js"></script>
</body>
</html>
