<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../static/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h1>StaySwich<span class="dot">.</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="{{url_for('index')}}" class="active">Home</a></li>
            <li><a href="{{url_for('about')}}">About</a></li>
            {% if session.get('logged_in') %}
            <li><a href="{{ url_for('auth.profile') }}" class="profile-btn">
                <i class="fa-solid fa-user"></i> Profile
            </a></li>
            <li><a href="{{ url_for('auth.logout') }}" class="logout-btn">Logout</a></li>
        {% else %}
            <li><a href="{{ url_for('auth.login') }}" class="login-btn">Login</a></li>
        {% endif %}
        </ul>
        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <div class="profile-container">
        <div class="profile-card">
            <div>
                <img id="profile-img" alt="User Avatar" class="profile-img" src="https://th.bing.com/th/id/R.20748d35b75f5f7d854c9cd749b584a7?rik=Ic%2b7AI31hhsAhQ&pid=ImgRaw&r=0">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Set Profile Picture</button>
            </div>
           
            <div class="user-data"> 
                {% block content %}
                <h2 id="user-name"> Name :{{ user.fullname }}</h2>
                <p id="user-email"> email : {{user.email}}</p>
                <button class="edit-btn" onclick="openModal()">Edit Profile</button>
                
                <a href="{{url_for('houses.dashboard')}}"> <button class="add-house">Add Your House Now !</button></a>
            </div>
        </div>
    </div>
    <!-- Modal for Editing Profile -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Edit Profile</h3>

            <div class="profile-pic" id="profilePic">👤</div>
            <input type="file" id="fileInput" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Set Profile Picture</button>

            <div class="input-group">
                <label>Display Name</label>
                <input type="text" id="displayName">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email">
            </div>

            <div class="input-group">
                <label>Location</label>
                <input type="text" id="Location">
            </div>

            <div class="input-group">
                <label>Bio</label>
                <input type="text" id="bio">
            </div>

            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveProfile()">Save</button>
            </div>
        </div>
    </div>

    <script src="../static/js/profile.js"></script>
</body>
</html>
