<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Listings - CRUD</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <h1>Manage Your House Listings</h1>
    </header>
    
    <main>
        <!-- Add New House Listing -->
        <form id="houseForm">
            <input type="text" id="houseName" placeholder="House Name" required>
            <input type="text" id="location" placeholder="Location" required>
            <input type="text" id="description" placeholder="Description" required>
            <input type="file" id="houseImage" accept="image/*">
            <button type="submit" id="submitHouse">Add Your House</button>
        </form>
        
        <!-- Display House Listings -->
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>House Name</th>
                    <th>Location</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="houseList"></tbody>
        </table>
    </main>
    
    <script src="../static/js/dashbord.js" ></script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Swap Log</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        .post {
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>House Swap Listings</h1>
    <div id="posts"></div>
    <button class="btn" onclick="createPost()">Create Post</button>

    <script>
        // Fetch and display posts
        function loadPosts() {
            fetch('/api/posts')
                .then(response => response.json())
                .then(posts => {
                    const postsContainer = document.getElementById('posts');
                    postsContainer.innerHTML = '';
                    posts.forEach(post => {
                        const postDiv = document.createElement('div');
                        postDiv.classList.add('post');
                        postDiv.innerHTML = `
                            <h2>${post.title}</h2>
                            <p>${post.description}</p>
                            <p><strong>Availability:</strong> ${post.availability}</p>
                            <p><strong>Contact:</strong> ${post.contact}</p>
                            <button class="btn" onclick="editPost(${post.id})">Edit</button>
                            <button class="btn" onclick="deletePost(${post.id})">Delete</button>
                        `;
                        postsContainer.appendChild(postDiv);
                    });
                });
        }

        // Create new post
        function createPost() {
            const newPost = {
                id: Date.now(),
                title: "New House Listing",
                description: "A brand new house to swap!",
                availability: "Available soon",
                contact: "contact@newhouse.com"
            };
            fetch('/api/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newPost)
            })
            .then(() => loadPosts());
        }

        // Edit post
        function editPost(id) {
            const updatedPost = {
                id,
                title: "Updated House Listing",
                description: "Updated description.",
                availability: "Available now",
                contact: "contact@updatedhouse.com"
            };
            fetch(`/api/posts/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedPost)
            })
            .then(() => loadPosts());
        }

        // Delete post
        function deletePost(id) {
            fetch(`/api/posts/${id}`, {
                method: 'DELETE'
            })
            .then(() => loadPosts());
        }

        // Load posts on page load
        window.onload = loadPosts;
    </script>
</body>
</html>
