<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StaySwitch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h1>StaySwitch<span class="dot">.</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="{{url_for('index')}}" class="active">Home</a></li>
            <li><a href="{{url_for('about')}}">About</a></li>
        </ul>
        <a href="{{url_for('profile')}}" class="profile-btn"><i class="fa-solid fa-user"></i></a>
    </nav>

    <div class="main">
        <div class="login">
            <form action="" method="POST">
                <label for="email">Login</label>
                <br>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <input type="password" name="pswd" id="pswd" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="haveAccout">
                <a href="{{url_for('forgetpassword')}}">Forgot password?</a><br>
                <a href="{{url_for('signup')}}">Create an account</a>
            </div>
        </div>
    </div>
</body>
</html>
