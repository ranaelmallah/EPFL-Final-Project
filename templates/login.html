
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign</title>
     <!-- Font Awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h1>StaySwich<span class="dot">.</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="{{url_for('index')}}" >Home</a></li>
            <li><a href="{{url_for('about')}}">About</a></li>
            <!-- <a href="{{url_for('auth.profile')}}" class="profile-btn active"><i class="fa-solid fa-user"></i></a> -->
        </ul>
        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i> 
        </button>
    </nav>
    <div class="container">
        <div class="mask"> 
            <div class="login-box">
              
                <h2>Login</h2>
               
                <form action='{{url_for('auth.login')}}' method="POST">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Example@gmail.com" required/>
                    <span id="email-error" class="error-message"> email address not exist.</span>
          
                    <label for="password">password</label>
                    <input type="password" name="password" placeholder="Password" required/>
                    <span id="password-error" class="error-message">Password wrong.</span>
          
                    <input type="submit" value="Log In" class="submit"  />
                  </form>
                <div class="haveAccout">
                    <a href="{{url_for('auth.signup')}}">Create Account?</a>

                </div>
            </div>
        </div>
    </div>
    <script src="../static/js/login.js"></script>
</body>
</html>
